<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost pet? — Alessandro Pet Spa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{--ivory:#F7F2E7;--ink:#1D2420;--mute:#5C655E;--pine:#17352B;--apricot:#DE7040;--apricot2:#C85A2C}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Helvetica,Arial,sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;-webkit-font-smoothing:antialiased}
  .paw{font-size:52px}
  .code{font-size:13px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--apricot2);margin-top:18px}
  h1{font-family:Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(38px,8vw,64px);line-height:1.05;color:var(--pine);margin-top:10px}
  p{color:var(--mute);max-width:420px;margin-top:14px;font-size:16px;line-height:1.55}
  a.btn{display:inline-block;margin-top:28px;background:var(--pine);color:var(--ivory);text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:999px}
  a.btn:hover{background:var(--apricot2)}
  .call{margin-top:16px;font-size:14px;color:var(--mute)}
  .call a{color:var(--pine);font-weight:700}
</style>
</head>
<body>
  <span class="paw">🐾</span>
  <p class="code">404 — Page not found</p>
  <h1>This one wandered off.</h1>
  <p>The page you're looking for isn't here — it may have been moved, or the address has a typo.</p>
  <a class="btn" href="./index.html">Back to the spa →</a>
  <p class="call">Or call us: <a href="tel:+13236444946">(323) 644-4946</a> · Mon–Fri 8–5 · Sat–Sun 9–5</p>
</body>
</html>
